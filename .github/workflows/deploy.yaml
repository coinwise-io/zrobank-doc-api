name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on
  schedule:
    # Every day at 6 am UTC.
    - cron:  '0 6 * * *'
  workflow_dispatch:

env:
  PAAS_BASE_URL: ${{ secrets.PAAS_BASE_URL }}
  GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
  BAAS_BASE_URL: ${{ secrets.BAAS_BASE_URL }}
  GATEWAY_BASE_API_URL: ${{ secrets.GATEWAY_BASE_API_URL }}
  ZRO_INTERNATIONAL_DOCUMENTATION_URL: ${{ secrets.ZRO_INTERNATIONAL_DOCUMENTATION_URL }}

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable
      - name: Activate Yarn from packageManager
        run: corepack prepare yarn@4.12.0 --activate
      - name: Verify toolchain
        run: |
          node --version
          yarn --version
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build website
        run: yarn build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
